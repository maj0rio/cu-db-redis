bind 0.0.0.0
protected-mode no
port 6379

# Персистентность: RDB + AOF
save 900 1
save 300 10
save 60 10000
appendonly yes
appendfsync everysec
auto-aof-rewrite-percentage 100

# Память и вытеснение
maxmemory 256mb
maxmemory-policy volatile-lru

# Защита от split-brain
min-replicas-to-write 1
min-replicas-max-lag 10
