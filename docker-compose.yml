x-sentinel: &sentinel
  image: redis:7
  command: sh -c "cp /etc/redis/sentinel.conf /tmp/sentinel.conf && redis-sentinel /tmp/sentinel.conf"
  volumes:
    - ./sentinel/sentinel.conf:/etc/redis/sentinel.conf:ro
  networks: [gamehub]
  depends_on: [redis-master, redis-replica-1, redis-replica-2]

services:
  redis-master:
    image: redis:7
    container_name: redis-master
    command: sh -c "cp /etc/redis/master.conf /data/redis.conf && redis-server /data/redis.conf --replica-announce-ip redis-master"
    ports: ["6379:6379"]
    volumes:
      - ./redis/master.conf:/etc/redis/master.conf:ro
      - master-data:/data
    networks: [gamehub]

  redis-replica-1:
    image: redis:7
    container_name: redis-replica-1
    command: sh -c "cp /etc/redis/replica.conf /data/redis.conf && redis-server /data/redis.conf --replicaof redis-master 6379 --replica-announce-ip redis-replica-1"
    ports: ["6380:6379"]
    volumes:
      - ./redis/replica.conf:/etc/redis/replica.conf:ro
      - replica1-data:/data
    networks: [gamehub]
    depends_on: [redis-master]

  redis-replica-2:
    image: redis:7
    container_name: redis-replica-2
    command: sh -c "cp /etc/redis/replica.conf /data/redis.conf && redis-server /data/redis.conf --replicaof redis-master 6379 --replica-announce-ip redis-replica-2"
    ports: ["6381:6379"]
    volumes:
      - ./redis/replica.conf:/etc/redis/replica.conf:ro
      - replica2-data:/data
    networks: [gamehub]
    depends_on: [redis-master]

  sentinel-1:
    <<: *sentinel
    container_name: sentinel-1
    ports: ["26379:26379"]

  sentinel-2:
    <<: *sentinel
    container_name: sentinel-2
    ports: ["26380:26379"]

  sentinel-3:
    <<: *sentinel
    container_name: sentinel-3
    ports: ["26381:26379"]

  redis-insight:
    image: redis/redisinsight:latest
    container_name: redis-insight
    ports: ["5540:5540"]
    networks: [gamehub]

  app:
    build: ./app
    container_name: gamehub-app
    ports: ["8000:8000"]
    environment:
      REDIS_MASTER_NAME: mymaster
      REDIS_SENTINELS: sentinel-1:26379,sentinel-2:26379,sentinel-3:26379
    networks: [gamehub]
    depends_on: [sentinel-1, sentinel-2, sentinel-3]

  consumer:
    build: ./app
    container_name: gamehub-consumer
    command: python consumer.py
    environment:
      REDIS_MASTER_NAME: mymaster
      REDIS_SENTINELS: sentinel-1:26379,sentinel-2:26379,sentinel-3:26379
    networks: [gamehub]
    depends_on: [sentinel-1, sentinel-2, sentinel-3]

networks:
  gamehub:

volumes:
  master-data:
  replica1-data:
  replica2-data: